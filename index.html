<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Enter.Key</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      background-color: #050505;
      color: #ffffff;
      font-family: monospace;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      text-align: center;
      position: relative;
      overflow: hidden;
    }
    .background-overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: url('12669.png') no-repeat center center;
      background-size: contain;
      opacity: 0.6;
      z-index: 1;
    }
    .content {
      position: relative;
      z-index: 2;
      max-width: 600px;
      padding: 20px;
    }
    h1 {
      font-size: 2.5rem;
      letter-spacing: 4px;
      margin-bottom: 2rem;
      font-weight: normal;
    }
    p.hint {
      font-size: 0.95rem;
      color: #cccccc;
      margin-bottom: 1rem;
    }
    p.subtext {
      font-size: 0.75rem;
      color: #666666;
      letter-spacing: 2px;
      text-transform: uppercase;
      margin-top: 2rem;
    }
    .cursor {
      display: inline-block;
      width: 8px;
      height: 15px;
      background-color: #ffffff;
      vertical-align: middle;
      margin-left: 4px;
    }
  </style>
</head>
<body>
  <div class="background-overlay"></div>
  <div class="content">
    <h1>Enter.Key</h1>
    <p class="hint">The first door is always the easiest.<span class="cursor"></span></p>
    <p class="subtext">SOMETHING IS WAITING</p>
  </div>
</body>
</html>
