<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Enter_key</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      background-color: #050505;
      color: #ffffff;
      font-family: monospace;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      text-align: center;
      position: relative;
      overflow: hidden;
    }

    /* Viewport Wrapper */
    .viewport-wrapper {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    /* 40% Opacity Logo Background */
    .background-overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: url('12669.png') no-repeat center center;
      background-size: contain;
      opacity: 0.40;
      z-index: 1;
    }

    /* Canvas Static Layer */
    #static-canvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 2;
      pointer-events: none;
      opacity: 0;
      animation: fadeInStatic 10s ease-in-out forwards;
    }

    /* Fullscreen Digital Glitch Layer */
    #glitch-canvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 3;
      pointer-events: none;
      opacity: 0;
      mix-blend-mode: screen;
      transition: opacity 0.4s ease;
    }

    @keyframes fadeInStatic {
      0% { opacity: 0; }
      100% { opacity: 0.25; }
    }

    /* Horizontal TV Scanlines Layer */
    .tv-scanlines {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 4;
      pointer-events: none;
      opacity: 0;
      background: linear-gradient(
        to bottom,
        rgba(255,255,255,0),
        rgba(255,255,255,0) 50%,
        rgba(0, 0, 0, 0.6) 50%,
        rgba(0, 0, 0, 0.6)
      );
      background-size: 100% 4px;
      animation: fadeInScanlines 10s ease-in-out forwards;
    }

    @keyframes fadeInScanlines {
      0% { opacity: 0; }
      100% { opacity: 1; }
    }

    /* Moving Horizontal Distortion Bar */
    .tv-bar {
      position: absolute;
      top: -20%;
      left: 0;
      width: 100%;
      height: 20%;
      background: linear-gradient(
        to bottom,
        rgba(255, 255, 255, 0) 0%,
        rgba(255, 255, 255, 0.08) 50%,
        rgba(255, 255, 255, 0) 100%
      );
      z-index: 5;
      pointer-events: none;
      animation: scanBar 8s linear infinite;
    }

    @keyframes scanBar {
      0% { top: -20%; }
      100% { top: 120%; }
    }

    /* Main Content */
    .content {
      position: relative;
      z-index: 6;
      max-width: 600px;
      padding: 20px;
      width: 100%;
    }
    
    h1 {
      font-size: 2.5rem;
      letter-spacing: 4px;
      margin-bottom: 2rem;
      font-weight: bold;
      position: relative;
      font-style: italic;
      color: transparent;
      background: repeating-radial-gradient(circle at 50% 50%, #ffffa0 0%, #333 100%);
      background-clip: text;
      -webkit-background-clip: text;
      opacity: 0.8;
      filter: drop-shadow(0px 0px 3px rgba(0, 0, 0, 0.95)) drop-shadow(0px 2px 5px #000000);
      display: inline-block;
      cursor: pointer;
      user-select: none;
      transition: opacity 0.2s ease, filter 0.2s ease, transform 0.1s ease;
    }

    h1:hover, h1:active {
      opacity: 1;
      filter: drop-shadow(0px 0px 8px rgba(255, 255, 160, 0.8)) drop-shadow(0px 0px 15px rgba(255, 0, 85, 0.6));
      animation: headingStaticGlitch 0.15s infinite alternate;
    }

    @keyframes headingStaticGlitch {
      0% { transform: skewX(0deg) translate(0, 0); }
      20% { transform: skewX(12deg) translate(-3px, 1px); }
      40% { transform: skewX(-8deg) translate(3px, -1px); }
      60% { transform: skewX(4deg) translate(-1px, 2px); }
      80% { transform: skewX(-10deg) translate(2px, -2px); }
      100% { transform: skewX(0deg) translate(0, 0); }
    }

    p.hint {
      font-size: 0.95rem;
      color: #cccccc;
      margin-bottom: 2rem;
    }
    
    .input-container {
      display: flex;
      justify-content: center;
      align-items: center;
      margin-bottom: 2rem;
    }
    
    .key-input {
      background: rgba(0, 0, 0, 0.7);
      border: 1px solid #ffffff;
      color: #ffffff;
      font-family: monospace;
      font-size: 1rem;
      padding: 10px 15px;
      width: 280px;
      text-align: center;
      outline: none;
      letter-spacing: 2px;
    }
    
    .key-input:focus {
      border-color: #cccccc;
      box-shadow: 0 0 8px rgba(255, 255, 255, 0.3);
    }

    .layer2-input {
      margin-top: 2rem;
      border-color: #00ff66;
      color: #00ff66;
    }
    
    .layer2-input:focus {
      border-color: #00ff66;
      box-shadow: 0 0 8px rgba(0, 255, 102, 0.5);
    }

    p.subtext {
      font-size: 0.75rem;
      color: #666666;
      letter-spacing: 2px;
      text-transform: uppercase;
      margin-top: 1rem;
    }

    /* --- SUCCESS SCREEN OVERLAY (LAYER 1) --- */
    #success-screen {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background-color: #050505;
      color: #00ff66;
      font-family: monospace;
      z-index: 9999;
      justify-content: center;
      align-items: center;
      flex-direction: column;
      text-align: center;
    }

    #success-screen h2 {
      font-size: 2.2rem;
      letter-spacing: 6px;
      color: #00ff66;
      text-shadow: 0 0 10px rgba(0, 255, 102, 0.6), 0 0 20px rgba(0, 255, 102, 0.3);
      border: 2px solid #00ff66;
      padding: 15px 30px;
      background: rgba(0, 20, 0, 0.8);
      box-shadow: 0 0 15px rgba(0, 255, 102, 0.2);
    }

    /* --- SUCCESS SCREEN OVERLAY (LAYER 2 - VORTEX) --- */
    #success-screen-layer2 {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background-color: #020200;
      font-family: monospace;
      z-index: 10000;
      justify-content: center;
      align-items: center;
      flex-direction: column;
      text-align: center;
      overflow: hidden;
      perspective: 800px;
    }

    /* The Singularity Center Point */
    .yellow-light-core {
      position: absolute;
      top: 50%;
      left: 50%;
      width: 4px;
      height: 4px;
      background: #ffffff;
      border-radius: 50%;
      transform: translate(-50%, -50%);
      box-shadow: 
        0 0 60px 40px #ffffff,
        0 0 150px 80px #ffff00,
        0 0 350px 180px #ff7700;
      z-index: 1;
      animation: corePulse 0.8s ease-in-out infinite alternate;
    }

    @keyframes corePulse {
      0% { opacity: 0.8; transform: translate(-50%, -50%) scale(1); }
      100% { opacity: 1; transform: translate(-50%, -50%) scale(1.2); }
    }

    /* Spinning Tunnel Rays Background */
    .yellow-tunnel {
      position: absolute;
      top: -50%;
      left: -50%;
      width: 200%;
      height: 200%;
      background: repeating-conic-gradient(
        from 0deg,
        rgba(255, 255, 0, 0.3) 0deg 3deg,
        transparent 3deg 8deg
      );
      z-index: 1;
      animation: tunnelSpin 12s linear infinite;
      /* Masks the edges and center so it feels like a volumetric tube */
      -webkit-mask-image: radial-gradient(circle at center, transparent 8%, black 35%, transparent 70%);
      mask-image: radial-gradient(circle at center, transparent 8%, black 35%, transparent 70%);
    }

    @keyframes tunnelSpin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(-360deg); }
    }

    /* 3D Warp Rings Sucking Inward */
    .warp-ring {
      position: absolute;
      top: 50%;
      left: 50%;
      width: 150vw;
      height: 150vw;
      border-radius: 50%;
      border: 2px solid rgba(255, 255, 0, 0.8);
      box-shadow: 
        inset 0 0 50px rgba(255, 200, 0, 0.4),
        0 0 50px rgba(255, 255, 0, 0.6);
      transform: translate(-50%, -50%) scale(2);
      opacity: 0;
      z-index: 2;
      animation: warpSuck 2s cubic-bezier(0.5, 0, 0.1, 1) infinite;
    }

    @keyframes warpSuck {
      0% { 
        transform: translate(-50%, -50%) scale(1.5) translateZ(300px); 
        opacity: 0; 
        border-width: 2px;
      }
      20% {
        opacity: 0.8;
      }
      100% { 
        /* Pulls directly into the dead center */
        transform: translate(-50%, -50%) scale(0) translateZ(-500px); 
        opacity: 1; 
        border-width: 15px;
        border-color: #ffffff;
        box-shadow: inset 0 0 100px #ffffff, 0 0 100px #ffffff;
      }
    }

    /* Glowing Text Acting As The Window */
    #success-screen-layer2 h2 {
      position: relative;
      z-index: 10;
      font-size: 3.5rem;
      font-weight: 900;
      letter-spacing: 12px;
      margin: 0;
      text-transform: uppercase;
      /* Bright gradient applied to the text fill itself */
      background: linear-gradient(180deg, #ffffff 0%, #ffff66 35%, #ffaa00 100%);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      /* Outer bloom filter instead of rigid text-shadows */
      filter: drop-shadow(0 0 15px rgba(255, 255, 0, 0.8)) drop-shadow(0 0 40px rgba(255, 100, 0, 0.6));
      animation: textHover 2s ease-in-out infinite alternate;
    }

    @keyframes textHover {
      0% { 
        transform: scale(1); 
        filter: drop-shadow(0 0 10px rgba(255, 255, 0, 0.6)) drop-shadow(0 0 30px rgba(255, 100, 0, 0.4)); 
      }
      100% { 
        transform: scale(1.03); 
        filter: drop-shadow(0 0 25px rgba(255, 255, 255, 1)) drop-shadow(0 0 60px rgba(255, 200, 0, 0.8)); 
      }
    }

    /* Secret Ciphered Message */
    .secret-corner-message {
      position: absolute;
      bottom: 12px;
      right: 15px;
      color: rgb(1, 1, 1);
      font-size: 0.7rem;
      line-height: 1.4;
      text-align: right;
      pointer-events: auto;
      user-select: text;
    }

    /* --- GLITCH ANIMATIONS --- */
    .glitching .viewport-wrapper {
      animation: screenShake 0.25s infinite alternate;
    }

    .glitching h1:not(:hover) {
      animation: textJitter 0.15s infinite;
    }

    .glitching .key-input {
      animation: borderFlicker 0.1s infinite;
    }

    @keyframes screenShake {
      0% { transform: translate(0, 0); }
      20% { transform: translate(-5px, 3px); }
      40% { transform: translate(4px, -2px); }
      60% { transform: translate(-3px, -3px); }
      80% { transform: translate(5px, 2px); }
      100% { transform: translate(0, 0); }
    }

    @keyframes textJitter {
      0% { transform: skew(0deg); }
      20% { transform: skew(8deg) translate(-4px, 2px); }
      40% { transform: skew(-6deg) translate(4px, -2px); }
      60% { transform: skew(0deg); }
      80% { transform: skew(10deg); }
      100% { transform: skew(0deg); }
    }

    @keyframes borderFlicker {
      0% { border-color: #ffffff; box-shadow: none; }
      50% { border-color: #ff0055; box-shadow: -4px 0 #00ffff; }
      100% { border-color: #ffffff; box-shadow: none; }
    }

    /* --- FAKE SYSTEM CRASH SCREEN --- */
    #crash-screen {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background-color: #0000aa;
      color: #ffffff;
      font-family: monospace;
      z-index: 99999;
      padding: 40px;
      text-align: left;
      flex-direction: column;
      justify-content: flex-start;
      align-items: flex-start;
    }

    #crash-screen h2 {
      background-color: #aaaaaa;
      color: #0000aa;
      padding: 2px 8px;
      font-size: 1.2rem;
      font-weight: bold;
      display: inline-block;
      margin-bottom: 25px;
    }

    #crash-screen p {
      font-size: 1rem;
      line-height: 1.6;
      margin-bottom: 15px;
    }

    .crash-details {
      margin-top: 30px;
      color: #ffff55;
