<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Enter.Key</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      background-color: #050505;
      color: #ffffff;
      font-family: monospace;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      text-align: center;
      position: relative;
      overflow: hidden;
    }

    /* 40% Opacity Logo Background */
    .background-overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: url('12669.png') no-repeat center center;
      background-size: contain;
      opacity: 0.40;
      z-index: 1;
    }

    /* Animated Static Overlay */
    .static-overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 2;
      pointer-events: none;
      opacity: 0.08;
      background: repeating-radial-gradient(circle at 50% 50%, #fff, #000 2px);
      animation: staticNoise 0.15s infinite alternate;
    }

    @keyframes staticNoise {
      0% { transform: scale(1) translate(0, 0); }
      50% { transform: scale(1.02) translate(-1px, 1px); }
      100% { transform: scale(0.99) translate(1px, -1px); }
    }

    /* Main Content */
    .content {
      position: relative;
      z-index: 3;
      max-width: 600px;
      padding: 20px;
      width: 100%;
    }
    h1 {
      font-size: 2.5rem;
      letter-spacing: 4px;
      margin-bottom: 2rem;
      font-weight: normal;
    }
    p.hint {
      font-size: 0.95rem;
      color: #cccccc;
      margin-bottom: 2rem;
    }
    
    /* Terminal Input Field */
    .input-container {
      display: flex;
      justify-content: center;
      align-items: center;
      margin-bottom: 2rem;
    }
    .key-input {
      background: rgba(0, 0, 0, 0.7);
      border: 1px solid #ffffff;
      color: #ffffff;
      font-family: monospace;
      font-size: 1rem;
      padding: 10px 15px;
      width: 280px;
      text-align: center;
      outline: none;
      letter-spacing: 2px;
    }
    .key-input:focus {
      border-color: #cccccc;
      box-shadow: 0 0 8px rgba(255, 255, 255, 0.3);
    }

    p.subtext {
      font-size: 0.75rem;
      color: #666666;
      letter-spacing: 2px;
      text-transform: uppercase;
      margin-top: 1rem;
    }
  </style>
</head>
<body>
  <div class="background-overlay"></div>
  <div class="static-overlay"></div>
  
  <div class="content">
    <h1>Enter.Key</h1>
    <p class="hint">The first door is always the easiest.</p>
    
    <div class="input-container">
      <input type="text" class="key-input" placeholder="ENTER KEY..." autofocus />
    </div>

    <p class="subtext">SOMETHING IS WAITING</p>
  </div>
</body>
</html>
